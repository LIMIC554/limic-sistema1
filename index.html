<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMIC | Sistema de Gestión</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #ef4444;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 65px);
    }

    aside {
      width: 230px;
      background: white;
      padding: 20px;
      border-right: 1px solid #ddd;
    }

    aside button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 13px;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      margin-bottom: 5px;
      font-size: 15px;
    }

    aside button:hover {
      background: #f1f1f1;
    }

    main {
      flex: 1;
      padding: 30px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 27px;
      font-weight: bold;
    }

    .actions {
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    .actions h2 {
      margin-bottom: 18px;
    }

    .action-button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .action-button:hover {
      background: #b91c1c;
    }

    @media(max-width: 700px) {
      aside {
        width: 80px;
        padding: 10px 5px;
      }

      aside button {
        font-size: 11px;
        text-align: center;
      }

      main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo"><span>L</span> LIMIC</div>
  <div>Sistema Comercial</div>
</header>

<div class="container">

  <aside>
    <button>🏠 Inicio</button>
    <button>🛒 Ventas</button>
    <button>📦 Productos</button>
    <button>📊 Inventario</button>
    <button>💰 Caja</button>
    <button>👥 Clientes</button>
    <button>💳 Cuentas por cobrar</button>
    <button>🚚 Compras</button>
    <button>💸 Gastos</button>
    <button>🧾 Servicios</button>
    <button>📈 Reportes</button>
  </aside>

  <main>

    <h1>Panel principal</h1>

    <p class="subtitle">
      Administración de LIMIC
    </p>

    <div class="cards">

      <div class="card">
        <h3>Ventas de hoy</h3>
        <div class="number">Gs. 0</div>
      </div>

      <div class="card">
        <h3>Dinero en caja</h3>
        <div class="number">Gs. 0</div>
      </div>

      <div class="card">
        <h3>Productos</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Stock bajo</h3>
        <div class="number">0</div>
      </div>

    </div>

    <div class="actions">

      <h2>Acciones rápidas</h2>

      <button class="action-button"
        onclick="alert('Módulo de ventas funcionando')">
        + Nueva venta
      </button>

      <button class="action-button"
        onclick="alert('Módulo de productos funcionando')">
        + Producto
      </button>

      <button class="action-button"
        onclick="alert('Módulo de caja funcionando')">
        Abrir caja
      </button>

    </div>

  </main>

</div>

</body>
</html>
